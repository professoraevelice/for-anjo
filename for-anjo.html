<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anjo, Be Mine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Quicksand:wght@500;700&display=swap">
<style>
/* Layout: um cartão de carta no centro da tela, botões que reagem a cada tentativa */
:root{
  --bg:#ffe4ea; --bg2:#ffd0dc; --card:#fffafb; --ink:#5a1e32; --soft:#a4566f;
  --sim:#e8345c; --sim-ink:#fff; --nao:#efe3e7; --nao-ink:#7b4b5c;
  --display:"Sniglet","Comic Sans MS",cursive; --body:"Quicksand",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:radial-gradient(circle at 20% 15%,var(--bg2) 0 18%,transparent 19%),
             radial-gradient(circle at 85% 80%,var(--bg2) 0 14%,transparent 15%),var(--bg);
  color:var(--ink); font-family:var(--body); overflow-x:hidden;
  display:grid; place-items:center; padding-inline:16px; box-sizing:border-box;
}
canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.card{
  position:relative; z-index:1; width:min(420px,100%); background:var(--card);
  border-radius:28px; padding:32px 24px 28px; text-align:center;
  box-shadow:0 18px 40px -18px rgba(150,30,70,.45); box-sizing:border-box;
}
.bicho{font-size:72px;line-height:1;display:inline-block;animation:pula 1.6s ease-in-out infinite}
@keyframes pula{50%{transform:translateY(-8px) rotate(-4deg)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,38px);margin:14px 0 6px;text-wrap:balance;line-height:1.1}
.sub{color:var(--soft);font-weight:700;margin:0 0 24px;min-height:1.4em}
.botoes{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:64px}
button{font-family:var(--display);border:0;cursor:pointer;border-radius:999px;transition:transform .2s,font-size .25s,padding .25s}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#sim{background:var(--sim);color:var(--sim-ink);font-size:22px;padding:12px 30px;box-shadow:0 6px 0 #b51f42}
#sim:hover{transform:scale(1.06)}
#sim:active{transform:translateY(3px);box-shadow:0 3px 0 #b51f42}
#nao{background:var(--nao);color:var(--nao-ink);font-size:18px;padding:10px 24px;z-index:5}
#nao.solto{position:fixed;transition:left .25s ease,top .25s ease,transform .2s,font-size .25s}
.contador{margin-top:18px;font-size:13px;color:var(--soft);min-height:1.2em}
.final[hidden]{display:none!important}
.final h1{font-size:clamp(30px,9vw,42px)}
.foto{display:block;width:100%;max-width:100%;max-height:46vh;object-fit:cover;border-radius:20px;border:5px solid var(--sim);box-sizing:border-box;margin:0 auto;animation:entra .6s ease-out}
@keyframes entra{from{transform:scale(.6) rotate(-6deg)}}
.final{margin-block:24px}
.foto2{margin-top:22px;animation-delay:.3s}
.final p.amor{font-family:var(--display);font-size:clamp(20px,6vw,26px);color:var(--sim);margin-top:14px;text-wrap:balance;line-height:1.25}
.selo{display:inline-block;font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--sim);border:2px dashed var(--sim);border-radius:8px;padding:4px 10px;transform:rotate(-3deg)}
.passo{font-size:13px;font-weight:700;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.opcoes{display:grid;gap:10px;margin-top:6px}
.opcao{background:var(--bg);color:var(--ink);font-size:17px;padding:12px 16px;border-radius:16px;text-align:left;border:2px solid transparent}
.opcao:hover{border-color:var(--sim)}
.reacao{font-weight:700;color:var(--sim);min-height:1.4em;margin:14px 0 0}
.btn{background:var(--sim);color:var(--sim-ink);font-size:20px;padding:12px 26px;box-shadow:0 6px 0 #b51f42;margin-top:8px}
.barra{height:14px;background:var(--bg);border-radius:999px;overflow:hidden;margin:16px 0 10px}
.barra i{display:block;height:100%;width:0;background:var(--sim);border-radius:inherit;transition:width .4s}
.log{font-family:ui-monospace,monospace;font-size:13px;color:var(--soft);text-align:left;min-height:6.5em;margin:0;white-space:pre-line}
.final p{font-weight:700;color:var(--soft);margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.bicho{animation:none}#nao.solto{transition:none}}
</style>

</head><body>
<canvas id="ceu"></canvas>

<main class="card" id="misterio">
  <div id="etapa"></div>
</main>

<main class="card" id="pergunta" hidden>
  <div class="bicho" id="bicho" aria-hidden="true">🐻</div>
  <h1>Anjo, will you be my boyfriend?</h1>
  <p class="sub" id="sub">Think about it carefully… 🥺</p>
  <div class="botoes">
    <button id="sim" type="button">Yes 💖</button>
    <button id="nao" type="button">No</button>
  </div>
  <p class="contador" id="contador"></p>
</main>

<script>
const etapa=document.getElementById('etapa');
const perguntas=[
 ["Who laughs at your bad jokes, even the REALLY bad ones?",["Her 😂","Only her, honestly","Wait… my jokes are bad?"],"Exactly. Nobody else does that. 📝"],
 ["Who would you share your last slice of pizza with?",["Her 🍕","Her (it would hurt a little)","Nobody… except her"],"Sharing pizza is true love. Science says so. 🍕"],
 ["Zombie apocalypse! Who do you want by your side?",["Her, obviously 🧟","Her. She's scarier than zombies","Her, she'd bring the snacks"],"Correct. The zombies don't stand a chance. 💪"],
 ["Who pops into your head when you see something cute?",["Her 🐶","Her again","Is this a trap?"],"Yes, it's a trap. A very cute one. 😏"],
 ["Who do you imagine next to you when you're old and wrinkly?",["Her 👵👴","Her, complaining about my snoring","Her, forever"],"Aww. Saved in the file forever. 💗"]
];
function capa(){
 etapa.innerHTML='<span class="selo">Top secret</span><div class="bicho" aria-hidden="true">🕵️</div><h1>Confidential file for: Anjo</h1><p class="sub">You have been chosen for a mysterious mission. Answer 5 questions with total honesty. 🔍</p><button class="btn" type="button" id="abrir">Open the file</button>';
 document.getElementById('abrir').onclick=()=>pergunta(0);
}
function pergunta(i){
 const [q,ops,r]=perguntas[i];
 etapa.innerHTML='<p class="passo">Mystery '+(i+1)+' of '+perguntas.length+'</p><h1 style="font-size:clamp(22px,6.5vw,28px)">'+q+'</h1><div class="opcoes">'+ops.map(o=>'<button class="opcao" type="button">'+o+'</button>').join('')+'</div><p class="reacao" id="reacao"></p>';
 etapa.querySelectorAll('.opcao').forEach(b=>b.onclick=()=>{
  etapa.querySelectorAll('.opcao').forEach(x=>x.disabled=true);
  b.style.borderColor='var(--sim)';
  document.getElementById('reacao').textContent=r;
  setTimeout(()=>i+1<perguntas.length?pergunta(i+1):analise(),1700);
 });
}
function analise(){
 etapa.innerHTML='<div class="bicho" aria-hidden="true">🧪</div><h1>Analyzing your answers…</h1><div class="barra"><i id="bar"></i></div><p class="log" id="log"></p>';
 const linhas=["> checking bad jokes… ✔","> counting pizza slices… ✔","> scanning zombie plans… ✔","> measuring cuteness levels… ✔","> looking into the future… 💗"];
 let k=0;const t=setInterval(()=>{
  document.getElementById('log').textContent+=linhas[k]+"\n";
  document.getElementById('bar').style.width=((k+1)/linhas.length*100)+'%';
  if(++k===linhas.length){clearInterval(t);setTimeout(resultado,1100)}
 },750);
}
function resultado(){
 etapa.innerHTML='<span class="selo">Mystery solved</span><div class="bicho" aria-hidden="true">💘</div><h1>Every answer points to the same person…</h1><p class="sub">The person who made this page for you. 100% match. 👀</p><p class="sub" style="margin-top:-12px">And now she has one last question…</p><button class="btn" type="button" id="ir">Show me 💌</button>';
 document.getElementById('ir').onclick=()=>{document.getElementById('misterio').hidden=true;document.getElementById('pergunta').hidden=false;};
}
capa();
</script>
<script>
const sim=document.getElementById('sim'),nao=document.getElementById('nao'),

const frases=[

  ["Are you sure? Look at this little face 🥺","🥺"],
  ["Wrong button, try the pink one 💗","😿"],

  const W=window.innerWidth,H=window.innerHeight;
  const s=sim.getBoundingClientRect(),atual=nao.getBoundingClientRect();
  let x,y,tent=0;
  do{
    x=m+Math.random()*(W-w-2*m); y=m+Math.random()*(H-h-2*m); tent++;
  }while(tent<40&&(
    (x<s.right+10&&x+w>s.left-10&&y<s.bottom+10&&y+h>s.top-10)||
    Math.hypot(x-atual.left,y-atual.top)<120));
  nao.style.left=x+'px'; nao.style.top=y+'px';
  nao.style.transform='rotate('+(Math.random()*30-15)+'deg)';
}
['pointerenter','pointerdown','touchstart','click','focus'].forEach(ev=>
  nao.addEventListener(ev,foge,{passive:false}));
nao.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){foge(e);}});

// Corações
const cv=document.getElementById('ceu'),ctx=cv.getContext('2d');
const calma=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pts=[],festa=false;
function tam(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',tam);tam();
function novo(baixo){return{x:Math.random()*innerWidth,y:baixo?innerHeight+20:Math.random()*innerHeight,
  r:6+Math.random()*(festa?14:8),v:.3+Math.random()*(festa?2.5:.7),o:Math.random()*6,
  c:['#ff7aa2','#e8345c','#ffb3c7','#ff4f81','#ffc94d'][Math.floor(Math.random()*5)],a:festa?.95:.35}}
for(let i=0;i<18;i++)pts.push(novo(false));
function coracao(x,y,r,c,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();
  ctx.moveTo(x,y+r*.3);ctx.bezierCurveTo(x,y-r*.3,x-r,y-r*.3,x-r,y+r*.3);
  ctx.bezierCurveTo(x-r,y+r*.8,x,y+r*1.1,x,y+r*1.5);
  ctx.bezierCurveTo(x,y+r*1.1,x+r,y+r*.8,x+r,y+r*.3);
  ctx.bezierCurveTo(x+r,y-r*.3,x,y-r*.3,x,y+r*.3);ctx.fill();ctx.restore()}
function loop(t){ctx.clearRect(0,0,innerWidth,innerHeight);
  pts.forEach((p,i)=>{p.y-=p.v;const x=p.x+Math.sin(t/900+p.o)*12;coracao(x,p.y,p.r,p.c,p.a);
    if(p.y<-40)pts[i]=novo(true)});
  if(!calma)requestAnimationFrame(loop)}
if(calma)loop(0);else requestAnimationFrame(loop);

sim.addEventListener('click',()=>{
  document.getElementById('pergunta').hidden=true;
  nao.remove();
  document.getElementById('final').hidden=false;
  festa=true; for(let i=0;i<90;i++)pts.push(novo(true));
  if(calma)loop(0);
});
</script>
